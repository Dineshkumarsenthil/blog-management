<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Write a Post — Blog Management API</title>
<style>
  :root { --bg:#0b0e14; --card:#131722; --border:#232838; --accent:#7c5cff; --accent-2:#22d3ee;
          --text:#e8eaf0; --dim:#8b93a7; --ok:#34d399; --err:#f87171; --warn:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; color:var(--text); min-height:100vh;
         background:radial-gradient(circle at 20% -10%, #1c1836 0%, var(--bg) 55%); padding:40px 20px 80px; }
  .wrap { max-width:820px; margin:0 auto; display:grid; gap:22px; }
  h1 { font-size:28px; margin:0 0 6px; background:linear-gradient(90deg,var(--accent),var(--accent-2));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  h2 { font-size:16px; margin:0; }
  .sub { color:var(--dim); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; display:grid; gap:12px; }
  input, textarea, select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
         padding:11px 13px; border-radius:10px; font-size:14px; font-family:inherit; outline:none; }
  input:focus, textarea:focus, select:focus { border-color:var(--accent); }
  textarea { resize:vertical; }
  .label { font-size:12px; color:var(--dim); margin-bottom:6px; }
  .opts { display:flex; gap:10px; flex-wrap:wrap; }
  .opts label { display:flex; align-items:center; gap:8px; padding:10px 14px; border:1px solid var(--border);
         border-radius:10px; cursor:pointer; font-size:14px; }
  .opts label:has(input:checked) { border-color:var(--accent); background:#1a1f33; }
  .opts input { width:auto; }
  .sched { display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .sched > div { flex:1; min-width:160px; }
  .actions { display:flex; gap:10px; }
  button { border:none; border-radius:10px; padding:11px 20px; font-weight:600; font-size:14px; cursor:pointer; }
  .primary { background:linear-gradient(90deg,var(--accent),#a78bfa); color:#fff; }
  .ghost { background:transparent; border:1px solid var(--border); color:var(--dim); }
  .link { background:none; color:var(--accent-2); padding:0; font-size:13px; }
  .msg { font-size:13px; min-height:18px; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .list-head { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .list-head select { width:auto; }
  .item { border:1px solid var(--border); border-radius:12px; padding:14px; display:grid; gap:6px; margin-top:10px; }
  .item-top { display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .when { font-size:12px; color:var(--dim); }
  .badge { font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; text-transform:capitalize; }
  .badge.draft { background:#3a3f55; color:#cbd2e6; }
  .badge.scheduled { background:#3b2f0f; color:var(--warn); }
  .badge.published { background:#0f3327; color:var(--ok); }
  .empty { color:var(--dim); font-size:13px; text-align:center; padding:18px 0; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 id="formTitle">Write a Post</h1>
    <div class="sub">Publish now, save a draft, or schedule it for later.</div>
  </header>

  <div class="card">
    <input id="tokenInput" type="password" placeholder="Paste your JWT token here..." autocomplete="off" />
    <input id="titleInput" placeholder="Post title" maxlength="200" />
    <textarea id="contentInput" rows="7" placeholder="Write your post..."></textarea>

    <div id="optsBlock">
      <div class="label">Publish Options</div>
      <div class="opts">
        <label><input type="radio" name="opt" value="publish" checked onchange="refreshOptionUI()" /> Publish Now</label>
        <label><input type="radio" name="opt" value="draft" onchange="refreshOptionUI()" /> Save as Draft</label>
        <label><input type="radio" name="opt" value="schedule" onchange="refreshOptionUI()" /> Schedule Post</label>
      </div>
      <div class="sched" id="schedRow" style="display:none;">
        <div><div class="label">Date</div><input type="date" id="dateInput" /></div>
        <div><div class="label">Time</div><input type="time" id="timeInput" /></div>
      </div>
    </div>

    <div class="msg" id="msg"></div>
    <div class="actions">
      <button id="submitBtn" class="primary" onclick="submitPost()">Publish Now</button>
      <button id="cancelBtn" class="ghost" style="display:none;" onclick="resetForm()">Cancel edit</button>
    </div>
  </div>

  <div class="card">
    <div class="list-head">
      <h2>My Posts</h2>
      <select id="filterSel" onchange="loadMine()">
        <option value="">All</option>
        <option value="draft">Drafts</option>
        <option value="scheduled">Scheduled</option>
        <option value="published">Published</option>
      </select>
    </div>
    <div id="list"><div class="empty">Paste your JWT token to see your posts.</div></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let editingId = null;
let editingStatus = null;
let cache = [];


(function () {
  const t = new URLSearchParams(location.search).get('token');
  if (t) { $('tokenInput').value = t; history.replaceState({}, '', location.pathname); }
})();

const z = n => String(n).padStart(2, '0');
$('dateInput').min = (() => { const d = new Date(); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; })();

function token() { return $('tokenInput').value.trim(); }
function headers(json) {
  const h = { 'Authorization': 'Bearer ' + token() };
  if (json) h['Content-Type'] = 'application/json';
  return h;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmt(iso) { return iso ? new Date(iso).toLocaleString() : '—'; }
function setMsg(text, kind) { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); }
function selectedOption() { return document.querySelector('input[name="opt"]:checked').value; }

function errText(data) {
  if (!data) return 'Something went wrong.';
  if (typeof data.detail === 'string') return data.detail;
  if (Array.isArray(data.detail)) return data.detail.map(e => e.msg).join(' ');
  return 'Something went wrong.';
}

function refreshOptionUI() {
  const opt = selectedOption();
  $('schedRow').style.display = opt === 'schedule' ? 'flex' : 'none';
  const labels = { publish: 'Publish Now', draft: 'Save as Draft', schedule: 'Schedule Post' };
  $('submitBtn').textContent = editingId ? 'Save Changes' : labels[opt];
}

function resetForm() {
  editingId = null; editingStatus = null;
  $('titleInput').value = ''; $('contentInput').value = '';
  $('dateInput').value = ''; $('timeInput').value = '';
  document.querySelector('input[name="opt"][value="publish"]').checked = true;
  $('optsBlock').style.display = 'block';
  $('cancelBtn').style.display = 'none';
  $('formTitle').textContent = 'Write a Post';
  refreshOptionUI();
}

async function submitPost() {
  if (!token()) return setMsg('Paste your JWT token first.', 'err');
  const title = $('titleInput').value.trim();
  const content = $('contentInput').value.trim();
  if (!title || !content) return setMsg('Title and content are required.', 'err');

  const body = { title, content };


  if (!(editingId && editingStatus === 'published')) {
    const opt = selectedOption();
    body.publish_option = opt;
    if (opt === 'schedule') {
      const d = $('dateInput').value, t = $('timeInput').value;
      if (!d || !t) return setMsg('Pick both a date and a time to schedule.', 'err');
      if (new Date(`${d}T${t}`) <= new Date()) return setMsg('Scheduled time must be in the future.', 'err');
      body.scheduled_at = `${d}T${t}:00`;
    }
  }

  try {
    const res = await fetch(editingId ? `/api/blogs/${editingId}` : '/api/blogs', {
      method: editingId ? 'PUT' : 'POST',
      headers: headers(true),
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) return setMsg(errText(data), 'err');

    const outcome = {
      draft: 'saved as a draft',
      scheduled: 'scheduled for ' + fmt(data.scheduled_at),
      published: 'published',
    }[data.status];
    setMsg(`Post ${outcome}.`, 'ok');
    resetForm();
    loadMine();
  } catch (err) {
    setMsg('Could not reach the server.', 'err');
  }
}

async function loadMine() {
  const list = $('list');
  if (!token()) { list.innerHTML = '<div class="empty">Paste your JWT token to see your posts.</div>'; return; }
  const f = $('filterSel').value;
  try {
    const res = await fetch('/api/blogs/mine' + (f ? `?status=${f}` : ''), { headers: headers(false) });
    if (!res.ok) { list.innerHTML = '<div class="empty">Could not load posts — check your token.</div>'; return; }
    cache = await res.json();
    if (!cache.length) { list.innerHTML = '<div class="empty">No posts here yet.</div>'; return; }

    list.innerHTML = cache.map(p => {
      const when = p.status === 'scheduled' ? 'Goes live: ' + fmt(p.scheduled_at)
                 : p.status === 'published' ? 'Published: ' + fmt(p.published_at)
                 : 'Not published yet';
      return `<div class="item">
        <div class="item-top"><strong>${esc(p.title)}</strong><span class="badge ${p.status}">${p.status}</span></div>
        <div class="when">${when}</div>
        <div><button class="link" onclick="startEdit(${p.id})">Edit</button></div>
      </div>`;
    }).join('');
  } catch (err) {
    list.innerHTML = '<div class="empty">Could not reach the server.</div>';
  }
}

function startEdit(id) {
  const p = cache.find(x => x.id === id);
  if (!p) return;
  editingId = p.id; editingStatus = p.status;
  $('titleInput').value = p.title;
  $('contentInput').value = p.content;
  $('formTitle').textContent = 'Edit Post';
  $('cancelBtn').style.display = 'inline-block';
  setMsg('', '');

  if (p.status === 'published') {
    $('optsBlock').style.display = 'none';  
  } else {
    $('optsBlock').style.display = 'block';
    const opt = p.status === 'scheduled' ? 'schedule' : 'draft';
    document.querySelector(`input[name="opt"][value="${opt}"]`).checked = true;
    if (p.scheduled_at) {
      const [d, t] = p.scheduled_at.split('T');
      $('dateInput').value = d;
      $('timeInput').value = t.slice(0, 5);
    }
  }
  refreshOptionUI();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

refreshOptionUI();
loadMine();
setInterval(loadMine, 10000);   
</script>
</body>
</html>
