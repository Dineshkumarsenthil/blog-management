<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Blog Management API</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 20% -10%, #1c1836 0%, #0b0e14 55%);
    color: #e8eaf0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .card {
    background: #131722;
    border: 1px solid #232838;
    border-radius: 18px;
    padding: 32px;
    width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    background: linear-gradient(90deg, #7c5cff, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }

  .subtitle {
    color: #8b93a7;
    font-size: 13px;
    margin-bottom: 22px;
  }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    background: #0b0e14;
    border: 1px solid #232838;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 0;
    font-size: 13px;
    font-weight: 600;
    color: #8b93a7;
    cursor: pointer;
    border-radius: 7px;
    transition: all 0.15s ease;
  }

  .tab.active {
    background: #232838;
    color: #e8eaf0;
  }

  /* ---- Inputs ---- */
  .field-label {
    font-size: 12px;
    color: #8b93a7;
    margin-bottom: 6px;
    display: block;
  }

  input {
    width: 100%;
    padding: 11px 13px;
    margin-bottom: 14px;
    background: #0b0e14;
    border: 1px solid #232838;
    border-radius: 9px;
    color: #e8eaf0;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-color: #7c5cff;
  }

  input::placeholder {
    color: #4b5163;
  }

  /* ---- Buttons ---- */
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 9px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }

  button:active {
    transform: scale(0.98);
  }

  .primary {
    background: linear-gradient(90deg, #7c5cff, #22d3ee);
    color: white;
  }

  .primary:hover { opacity: 0.92; }

  .primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .provider-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid #232838;
  }

  .google {
    background: #ffffff;
    color: #3c4043;
  }

  .google:hover { opacity: 0.92; }

  .facebook {
    background: #1877f2;
    color: white;
    border: none;
  }

  .facebook:hover { opacity: 0.92; }

  .provider-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* ---- Divider ---- */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 16px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #232838;
  }

  .divider span {
    font-size: 11px;
    color: #8b93a7;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  /* ---- Message ---- */
  .msg {
    font-size: 13px;
    margin-bottom: 10px;
    min-height: 16px;
  }

  .msg.err { color: #f87171; }
  .msg.ok { color: #34d399; }

  /* ---- Signed-in state ---- */
  .signed-in {
    text-align: center;
  }

  .avatar-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c5cff, #22d3ee);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: white;
    margin: 0 auto 16px;
  }

  .signed-in-text {
    font-size: 14px;
    color: #8b93a7;
    margin-bottom: 22px;
  }

  .signed-in-text b {
    color: #e8eaf0;
  }

  .logout-btn {
    background: #1c2130;
    color: #e8eaf0;
    border: 1px solid #232838;
  }

  .logout-btn:hover {
    border-color: #f87171;
    color: #f87171;
  }

  #authView { display: none; }
  #signedInView { display: none; }
</style>
</head>
<body>

<div class="card">

  <div id="signedInView" class="signed-in">
    <h1>Blog Management API</h1>
    <div class="subtitle">Sign in to continue</div>

    <div class="avatar-circle" id="avatarInitial">?</div>
    <div class="signed-in-text">Signed in as <b id="signedInName">—</b></div>

    <button class="primary" onclick="goToDashboard()">Go to Dashboard</button>
    <button class="logout-btn" onclick="logOut()">Log Out</button>
  </div>

  <!-- ============ AUTH FORM VIEW ============ -->
  <div id="authView">
    <h1>Blog Management API</h1>
    <div class="subtitle">Sign in to continue</div>

    <div class="tabs">
      <div class="tab active" id="loginTab" onclick="setMode('login')">Log In</div>
      <div class="tab" id="signupTab" onclick="setMode('signup')">Sign Up</div>
    </div>

    <div class="msg" id="msg"></div>

    <label class="field-label">Username</label>
    <input id="usernameInput" placeholder="Enter your username" autocomplete="username" />

    <div id="emailField" style="display:none;">
      <label class="field-label">Email</label>
      <input id="emailInput" placeholder="Enter your email" autocomplete="email" />
    </div>

    <label class="field-label">Password</label>
    <input id="passwordInput" type="password" placeholder="Enter your password" autocomplete="current-password" />

    <button class="primary" id="submitBtn" onclick="submitForm()">Log In</button>

    <div class="divider"><span>OR CONTINUE WITH</span></div>

    <button class="provider-btn google" onclick="window.location.href='/auth/login/google'">
      <svg class="provider-icon" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C33.5 5.1 29 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C33.5 5.1 29 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 45c5 0 9.5-1.9 12.9-5.1l-6-5c-2 1.4-4.6 2.1-6.9 2.1-5.2 0-9.6-3.3-11.2-8l-6.5 5C9.6 40.6 16.3 45 24 45z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6 5C40.9 35.8 44 30.5 44 24c0-1.4-.1-2.7-.4-3.5z"/>
      </svg>
      Continue with Google
    </button>

    <button class="provider-btn facebook" onclick="window.location.href='/auth/login/facebook'">
      <svg class="provider-icon" viewBox="0 0 24 24" fill="white">
        <path d="M22 12c0-5.5-4.5-10-10-10S2 6.5 2 12c0 5 3.7 9.1 8.4 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7C18.3 21.1 22 17 22 12z"/>
      </svg>
      Continue with Facebook
    </button>
  </div>

</div>

<script>
let mode = 'login';

/* ---- On load: check if already signed in ---- */
(function init() {
  const params = new URLSearchParams(window.location.search);
  const urlToken = params.get('token');

  if (urlToken) {
    localStorage.setItem('blog_token', urlToken);
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  const savedToken = localStorage.getItem('blog_token');
  const savedName = localStorage.getItem('blog_username');

  if (savedToken) {
    showSignedIn(savedName || 'there');
  } else {
    showAuthForm();
  }
})();

function showSignedIn(name) {
  document.getElementById('signedInView').style.display = 'block';
  document.getElementById('authView').style.display = 'none';
  document.getElementById('signedInName').textContent = name;
  document.getElementById('avatarInitial').textContent = name.charAt(0).toUpperCase();
}

function showAuthForm() {
  document.getElementById('signedInView').style.display = 'none';
  document.getElementById('authView').style.display = 'block';
}

function goToDashboard() {
  const token = localStorage.getItem('blog_token');
  window.location.href = '/static/dashboard.html?token=' + token;
}

function logOut() {
  localStorage.removeItem('blog_token');
  localStorage.removeItem('blog_username');
  showAuthForm();
}

/* ---- Tab switching ---- */
function setMode(newMode) {
  mode = newMode;
  document.getElementById('loginTab').classList.toggle('active', mode === 'login');
  document.getElementById('signupTab').classList.toggle('active', mode === 'signup');
  document.getElementById('submitBtn').textContent = mode === 'login' ? 'Log In' : 'Sign Up';
  document.getElementById('emailField').style.display = mode === 'signup' ? 'block' : 'none';
  document.getElementById('msg').textContent = '';
}

/* ---- Submit login/signup ---- */
async function submitForm() {
  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value.trim();
  const email = document.getElementById('emailInput').value.trim();
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  if (!username || !password || (mode === 'signup' && !email)) {
    msgEl.textContent = 'Please fill in all fields.';
    msgEl.className = 'msg err';
    return;
  }

  btn.disabled = true;

  try {
    const url = mode === 'login' ? '/auth/login' : '/auth/register';
    const body = mode === 'login'
      ? { username, password }
      : { username, email, password };

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (!res.ok) {
      msgEl.textContent = data.detail || 'Something went wrong.';
      msgEl.className = 'msg err';
      btn.disabled = false;
      return;
    }

    if (mode === 'signup') {
      msgEl.textContent = 'Account created! Please log in.';
      msgEl.className = 'msg ok';
      setMode('login');
      btn.disabled = false;
      return;
    }

    localStorage.setItem('blog_token', data.access_token);
    localStorage.setItem('blog_username', username);
    showSignedIn(username);

  } catch (err) {
    msgEl.textContent = 'Could not reach the server.';
    msgEl.className = 'msg err';
    btn.disabled = false;
  }
}

document.getElementById('passwordInput').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    submitForm();
  }
});
</script>

</body>
</html>@
